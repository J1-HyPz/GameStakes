name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gamestakes
          POSTGRES_PASSWORD: gamestakes
          POSTGRES_DB: gamestakes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamestakes"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Lint (ruff)
        run: ruff check backend
      - name: Format check (ruff)
        run: ruff format --check backend
      - name: Type check (mypy)
        working-directory: backend
        run: mypy app
      - name: Tests (pytest, SQLite)
        working-directory: backend
        run: pytest -v
      - name: Migrations against PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://gamestakes:gamestakes@localhost:5432/gamestakes
        run: |
          python -m app.db.migrate
          alembic downgrade base
          alembic upgrade head
      - name: OpenAPI types are up to date
        run: |
          cd backend && python -m app.scripts.export_openapi > openapi.json && cd ..
          npx --yes openapi-typescript@6 backend/openapi.json -o /tmp/api.ts
          diff -u frontend/src/types/api.ts /tmp/api.ts \
            || { echo "::error::frontend/src/types/api.ts is stale — run: cd backend && python -m app.scripts.export_openapi > openapi.json && cd ../frontend && npm run openapi"; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint
      - name: Tests (vitest)
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
