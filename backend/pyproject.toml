[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gamestakes"
version = "0.1.0"
description = "GameStakes — self-hosted multi-sport prediction and bet building platform"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "redis>=5.0.1",
    "apscheduler>=3.10,<4",
    "structlog>=24.1",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations: long constraint/DDL literals cannot be split.
"app/db/alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/alembic"]

[[tool.mypy.overrides]]
# scipy ships no usable stubs; scipy-stubs' overloads reject valid calls.
module = ["apscheduler.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
