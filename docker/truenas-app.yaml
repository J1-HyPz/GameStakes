# GameStakes on TrueNAS SCALE — Custom App ("Install via YAML").
#
# Before installing:
#   1. Create three datasets (Storage → Datasets), e.g. under
#      /mnt/<pool>/apps/gamestakes/ : config, data, logs
#   2. Note the UID/GID that owns them (`ls -n` on the dataset) and set
#      PUID/PGID below to match. A mismatch is the usual cause of a container
#      that restarts on first start.
#   3. Replace <pool> in the three volume paths with your pool name.
#
# The UI is published on host port 8100 (container listens on 8080).
#
# This is the slim configuration: one container, SQLite, no Redis — the right
# default for a home server, since the database is small and the app is
# single-user. Add PostgreSQL only if you want multiple workers.
#
# Provider API keys are optional: without them the app still runs and the UI
# shows which features are unavailable.
services:
  gamestakes:
    image: ghcr.io/j1-hypz/gamestakes:0.1.0
    container_name: gamestakes
    restart: unless-stopped
    ports:
      # host:container — change the left number to move the UI, not the right.
      - "8100:8080"
    environment:
      # --- storage -----------------------------------------------------
      DATABASE_URL: sqlite+aiosqlite:////data/gamestakes.db
      DATA_DIR: /data

      # --- ownership: must match the dataset owner ---------------------
      PUID: "1000"
      PGID: "1000"

      # --- display -----------------------------------------------------
      TIMEZONE: Europe/London
      CURRENCY: GBP
      LOG_LEVEL: INFO

      # --- staking: the builder will not size a bet until this is set ---
      BANKROLL: "0"
      KELLY_MULTIPLIER: "0.25"
      DAILY_EXPOSURE_CAP: "0.05"
      WEEKLY_EXPOSURE_CAP: "0.15"

      # --- provider keys (optional; see .env.example for where to get) --
      # Free and instant: https://www.football-data.org/client/register
      # FOOTBALL_DATA_ORG_KEY: ""
      # Required for the bet builder: https://the-odds-api.com
      # THE_ODDS_API_KEY: ""
      # ODDS_REGION: "uk"
      # BALLDONTLIE_KEY: ""
      # THESPORTSDB_KEY: ""

      # --- behind a reverse proxy on a subpath --------------------------
      # ROOT_PATH: /gamestakes

      # --- optional single-user login (set if reachable off your LAN) ---
      # AUTH_ENABLED: "true"
      # AUTH_PASSWORD: "change-me"
      # JWT_SECRET: "generate with: openssl rand -hex 32"
    volumes:
      - /mnt/<pool>/apps/gamestakes/config:/config
      - /mnt/<pool>/apps/gamestakes/data:/data
      - /mnt/<pool>/apps/gamestakes/logs:/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen(
              "http://127.0.0.1:8080/api/health", timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
